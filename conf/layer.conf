# We have a conf and classes directory, prepend to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
#BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "wr-template"
BBFILE_PATTERN_wr-template = ""
BBFILE_PATTERN_IGNORE_EMPTY_wr-template = "1"
BBFILE_PRIORITY_wr-template = "1"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_wr-template = "1"

LAYERDEPENDS_wr-template = "core"

LAYERSERIES_COMPAT_wr-template = "wrl whinlatter"

addpylib ${LAYERDIR}/lib wrtp

USER_CLASSES:append = " wrlbanner"

OE_FRAGMENTS:append = " ${@wrtp.template.templates_to_fragments(d)}"

# Handle BSP default fragment: <layerid>/bsp/${MACHINE}.conf
BSP_FRAGMENTS ?= "${@wrtp.template.default_bsp_fragment(d)}"
OE_FRAGMENTS:append = " ${BSP_FRAGMENTS}"
